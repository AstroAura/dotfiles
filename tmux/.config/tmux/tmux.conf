set -g default-shell /usr/bin/fish
set -g prefix C-a
bind C-a send-prefix
set -g status-style bg="default",fg="#b08060"

# Splits (keep current directory)
bind s split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane killing
bind x kill-pane

# Borders
set -g pane-border-style fg="#b08060"
set -g pane-active-border-style fg="#695748"

# Windows
bind c new-window -c "#{pane_current_path}"
bind -r n next-window
bind -r p previous-window
bind Tab last-window
bind q kill-window

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# Quality of life
set -g mouse on
set -g mode-style bg="#3a3025",fg="#b08060"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Startup
set-hook -g after-new-session 'if -F "#{!=:#{session_name},main}" "set destroy-unattached on"'
